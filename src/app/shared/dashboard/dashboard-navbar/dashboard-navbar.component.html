<div
  class="app-topbar py-2 px-6 bg-[#f8f4f3] flex items-center shadow-md shadow-black/5"
>
  <button
    type="button"
    class="text-lg text-gray-900 font-semibold sidebar-toggle"
    (click)="onMenuClick()"
  >
    <i class="ri-menu-line"></i>
  </button>

  <ul class="ml-auto flex items-center">
    <li class="list-none">
      <button
        type="button"
        class="border-0 bg-transparent p-0 cursor-pointer"
        (click)="toggleFullscreen()"
        aria-label="Pantalla completa"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          class="hover:bg-gray-100 rounded-full"
          viewBox="0 0 24 24"
          style="fill: gray"
        >
          <path
            d="M5 5h5V3H3v7h2zm5 14H5v-5H3v7h7zm11-5h-2v5h-5v2h7zm-2-4h2V3h-7v2h5z"
          ></path>
        </svg>
      </button>
    </li>
    <li class="dropdown ml-3 relative">
      <button
        type="button"
        class="dropdown-toggle flex items-center cursor-pointer rounded-md px-1 py-0.5 transition-colors hover:bg-gray-900/6"
        (click)="toggleProfileDropdown($event)"
        [attr.aria-expanded]="profileDropdownOpen"
        aria-haspopup="true"
      >
        <div class="shrink-0 w-10 h-10 relative">
          <div class="p-1 bg-white rounded-full focus:outline-none focus:ring">
            <img
              class="w-8 h-8 rounded-full"
              src="https://laravelui.spruko.com/tailwind/ynex/build/assets/images/faces/9.jpg"
              alt=""
            />
            <div
              class="top-0 left-7 absolute w-3 h-3 bg-lime-400 border-2 border-white rounded-full animate-ping"
            ></div>
            <div
              class="top-0 left-7 absolute w-3 h-3 bg-lime-500 border-2 border-white rounded-full"
            ></div>
          </div>
        </div>
        <div class="p-2 md:block text-left">
          <h2 class="text-sm font-semibold text-gray-800">Francisco Ortiz</h2>
          <p class="text-xs text-gray-500">Administrator</p>
        </div>
      </button>
      <ul
        class="dropdown-menu absolute right-0 top-full mt-1 shadow-md shadow-black/5 z-50 py-1.5 rounded-md bg-white border border-gray-100 w-full min-w-35 max-w-50"
        [class.hidden]="!profileDropdownOpen"
        role="menu"
      >
        <li>
          <a
            href="#"
            role="menuitem"
            class="flex items-center text-[13px] py-1.5 px-4 text-gray-600 hover:text-[#f84525] hover:bg-gray-50 cursor-pointer"
            (click)="onLogoutClick($event)"
            >Cerrar sesión</a
          >
        </li>
      </ul>
    </li>
  </ul>
</div>
