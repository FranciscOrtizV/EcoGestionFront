<div
  class="app-topbar py-2 px-6 bg-base-100 border-b border-base-300/80 flex items-center"
>
  <button
    type="button"
    class="text-lg text-base-content font-semibold sidebar-toggle cursor-pointer hover:bg-base-300/80 rounded-2xl px-2"
    (click)="onMenuClick()"
  >
    <i class="ri-menu-line"></i>
  </button>

  <ul class="ml-auto flex items-center">
    <li class="list-none">
      <button
        type="button"
        class="border-0 bg-transparent p-0 cursor-pointer text-base-content"
        (click)="toggleFullscreen()"
        aria-label="Pantalla completa"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          class="hover:bg-base-300 rounded-full fill-current p-0.5"
          viewBox="0 0 24 24"
        >
          <path
            d="M5 5h5V3H3v7h2zm5 14H5v-5H3v7h7zm11-5h-2v5h-5v2h7zm-2-4h2V3h-7v2h5z"
          ></path>
        </svg>
      </button>
    </li>
    <li class="dropdown ml-3 relative">
      <button
        type="button"
        class="dropdown-toggle flex items-center cursor-pointer rounded-md px-1 py-0.5 transition-colors hover:bg-base-300/80 text-base-content"
        (click)="toggleProfileDropdown($event)"
        [attr.aria-expanded]="profileDropdownOpen"
        aria-haspopup="true"
      >
        <div class="shrink-0 w-10 h-10 relative">
          <div class="p-1 bg-base-100 rounded-full focus:outline-none focus:ring ring-primary/30">
            <img
              class="w-8 h-8 rounded-full"
              src="https://laravelui.spruko.com/tailwind/ynex/build/assets/images/faces/9.jpg"
              alt=""
            />
            <div
              class="top-0 left-7 absolute w-3 h-3 bg-success border-2 border-base-100 rounded-full animate-ping"
            ></div>
            <div
              class="top-0 left-7 absolute w-3 h-3 bg-success border-2 border-base-100 rounded-full"
            ></div>
          </div>
        </div>
        <div class="p-2 md:block text-left">
          <h2 class="text-sm font-semibold text-base-content">
            {{ auth.currentUser()?.nombre }} {{ auth.currentUser()?.apellidoPaterno }}
          </h2>
          <p class="text-xs text-base-content/60">
            {{ auth.currentUser()?.roles?.[0]?.nombre ?? 'Usuario' }}
          </p>
        </div>
      </button>
      <ul
        class="dropdown-menu absolute right-0 top-full mt-1 shadow-lg shadow-base-content/10 z-50 py-1.5 rounded-md bg-base-100 border border-base-300 w-full min-w-35 max-w-50"
        [class.hidden]="!profileDropdownOpen"
        role="menu"
      >
        <li>
          <a
            href="#"
            role="menuitem"
            class="flex items-center text-[13px] py-1.5 px-4 text-base-content/80 hover:text-primary hover:bg-base-200 cursor-pointer"
            (click)="onLogoutClick($event)"
            >Cerrar sesión</a
          >
        </li>
      </ul>
    </li>
  </ul>
</div>
